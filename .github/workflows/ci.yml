name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobforge
          POSTGRES_PASSWORD: jobforge
          POSTGRES_DB: jobforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobforge -d jobforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://jobforge:jobforge@localhost:5432/jobforge
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Apply schema
        run: |
          for f in $(ls migrations/*.sql | sort); do
            echo "applying $f"
            PGPASSWORD=jobforge psql -v ON_ERROR_STOP=1 -h localhost -U jobforge -d jobforge -f "$f"
          done
      - name: Test
        run: pytest